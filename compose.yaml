services:
  gre-study-desk:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?Set ALLOWED_ORIGIN to the public HTTPS URL}
      DATABASE_PATH: /data/study.sqlite
      MEDIA_ROOT: /media
      # Set only when a trusted reverse proxy is immediately in front of this container.
      TRUST_PROXY: "true"
    volumes:
      - study-data:/data
      - ./GRE Quant:/media/GRE Quant:ro
      - ./GRE Verbal:/media/GRE Verbal:ro

volumes:
  study-data:
